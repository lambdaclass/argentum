services:
  postgres:
    container_name: game_backend_db
    image: postgres:16
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=argentum_dev
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - game_backend_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - 9090:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
     - 9100:3000
    volumes:
      - grafana_data:/var/lib/grafana

  # Dev helper: run migrations against the dockerised Postgres.
  # Usage: docker compose run --rm migrate
  migrate:
    image: hexpm/elixir:1.16.3-erlang-26.2.5.5-debian-bookworm-20240612
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: dev
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    entrypoint: ["sh", "-c"]
    command:
      - |
        mix local.hex --force --if-missing
        mix local.rebar --force --if-missing
        mix deps.get
        mix ecto.create
        mix ecto.migrate
    profiles: ["tools"]

  # Dev helper: run the full test suite against dockerised Postgres.
  # Usage: docker compose run --rm test
  test:
    image: hexpm/elixir:1.16.3-erlang-26.2.5.5-debian-bookworm-20240612
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: test
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    entrypoint: ["sh", "-c"]
    command:
      - |
        apt-get update -y && apt-get install -y build-essential clang protobuf-compiler curl
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        export PATH="/root/.cargo/bin:$${PATH}"
        mix local.hex --force --if-missing
        mix local.rebar --force --if-missing
        mix deps.get
        mix ecto.create --quiet
        mix ecto.migrate --quiet
        mix test
    profiles: ["tools"]

volumes:
  game_backend_data:
  grafana_data:
  mix_deps:
  mix_build:
