[package]
name = "ao-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bevy/WebGL2 Argentum client — one codebase for web (wasm) and native desktop."

[dependencies]
ao-core = { path = "../ao-core" }
log = "0.4"

# PNG only. The sheets are all PNG and every extra decoder is dead weight in
# the wasm payload.
image = { version = "0.25", default-features = false, features = ["png"] }

# Full default features for now. A hand-trimmed feature list produced a
# renderer that cleared the screen but drew no sprites, with no error — the 2D
# pipeline needs more than the obvious bevy_sprite/bevy_render pair. Get it
# rendering first, then trim with evidence rather than guesswork, since the
# wasm payload does matter to players.
[dependencies.bevy]
version = "0.18"
features = ["webgl2"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["Window", "Response"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
