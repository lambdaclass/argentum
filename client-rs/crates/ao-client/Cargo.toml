[package]
name = "ao-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bevy/WebGL2 Argentum client — one codebase for web (wasm) and native desktop."

[dependencies]
ao-core = { path = "../ao-core" }
log = "0.4"

# PNG only. The sheets are all PNG and every extra decoder is dead weight in
# the wasm payload.
image = { version = "0.25", default-features = false, features = ["png"] }

# Trimmed from Bevy's defaults, which pull in PBR, glTF, audio, gizmos, picking
# and more that a 2D client never uses.
#
# An earlier, tighter list (bevy_render + bevy_sprite + bevy_core_pipeline only)
# produced a renderer that cleared the screen and drew nothing, with no error at
# all — the 2D pipeline needs the whole sprite stack, not just the crates whose
# names suggest it. If sprites stop drawing after a change here, that is the
# first thing to suspect.
[dependencies.bevy]
version = "0.18"
default-features = false
# Bevy 0.18's defaults are ["2d", "3d", "ui"]. "2d" is a meta-feature carrying
# default_app, default_platform, 2d_bevy_render, ui, scene, audio and picking —
# the app and platform plumbing, not just the renderer. Selecting individual
# bevy_sprite/bevy_render features instead leaves an App that clears the screen
# and draws nothing, with no error. Drop "3d"; keep "2d".
features = ["2d", "webgl2", "png", "x11", "wayland"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Response",
  "WebSocket",
  "MessageEvent",
  "BinaryType",
  "ErrorEvent",
  "CloseEvent",
  "Event",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
