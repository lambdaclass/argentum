[workspace]
resolver = "2"
members = ["crates/ao-core", "crates/ao-client"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Pinned to the wasm-bindgen-cli provided by the dev shell. wasm-bindgen refuses
# to run when the crate and CLI versions differ, and the error it prints is not
# obvious, so keep these in lockstep with `wasm-bindgen --version`.
wasm-bindgen = "=0.2.114"

[profile.release]
# The client is downloaded by every player, so size matters as much as speed.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
