<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Argentum</title>

    <!--
      Development configuration.

      The client compiles no hosts and no credentials. In production it is
      served from the game origin and derives both endpoints from the page
      itself, so these tags are absent and there is nothing to keep in sync
      with a deployment.

      Development does not have that property yet: the API is on 4000, the
      gateway on 7667, and this page is usually served from a third port. Any
      of these can be overridden per load with a query parameter — ?server=,
      ?gateway=, ?name=, ?password=, ?hash= — which takes precedence over the
      tag.

      The character below is created on first contact, because the client
      still sends packet 74. Remove these two tags and the client starts
      without connecting rather than creating a character for every visitor.
    -->
    <meta name="ao:asset-origin" content="http://127.0.0.1:4000" />
    <meta name="ao:gateway-url" content="ws://127.0.0.1:7667/ao" />
    <meta name="ao:character-name" content="RustClient" />
    <meta name="ao:character-password" content="rust_client_pass" />

    <style>
      :root {
        --bg: #07090d;
        --panel: #0e1420;
        --panel-edge: #1d2739;
        --ink: #e8dcc4;
        --ink-dim: #8d9099;
        --gold: #e0a94a;
        --gold-soft: #f0c989;
        --danger: #ff8a73;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Three host modes, and the canvas always follows the host.
         `ui::shell` recomputes the Bevy layout and the camera viewport from
         whatever rectangle it is given; nothing here stretches anything.

         Windowed is the default: a bounded, centred game window matching the
         reference client's measured size (1295x760 there, 1280x760 here — the
         same 22% rail and the same world density, at a round width). It shrinks
         to fit a smaller viewport, so "bounded by default" never means "broken
         on a laptop".

         On a display large enough for a whole multiple of that size it steps up
         to it: 2x is 2560x1520, 3x is 3840x2280. Whole multiples only, because
         the world is pixel art — the client's world zoom is an integer, so a
         window 1.6x the design size does not show 1.6x-sized sprites, it shows
         the same sprites and more terrain. Stepping in whole multiples is the
         only way a larger window means a larger *scene* rather than a wider one.
         `--shell-steps` is set by the script below; 1 until a step actually
         fits, which on a 2560x1440 display is the whole time, since two steps
         need 1520 pixels of height. */
      #shell {
        width: min(calc(1280px * var(--shell-steps, 1)), 100vw);
        height: min(calc(760px * var(--shell-steps, 1)), 100vh);
        border: 1px solid var(--panel-edge);
        box-shadow: 0 0 0 1px #000, 0 18px 48px rgba(0, 0, 0, 0.75);
        overflow: hidden;
      }

      /* Maximized: the whole browser content area, tabs and address bar still
         visible. Deliberately distinct from fullscreen, which takes the
         display. */
      #shell.maximized {
        width: 100vw;
        height: 100vh;
        border: none;
        box-shadow: none;
      }

      /* Fullscreen: the browser sizes the element to the display, so only the
         window chrome has to go. */
      #shell:fullscreen {
        width: 100vw;
        height: 100vh;
        border: none;
        box-shadow: none;
      }

      /* Pixel art: never let the browser resample it. Bevy owns the backing
         store and applies the device pixel ratio itself, so the presented size
         must match the element exactly — CSS scaling here would put the world
         back on a fractional pixel grid. */
      #ao-canvas {
        display: block;
        /* `!important` because the client sets an inline size from its *backing
           store*, which is the CSS size times the device pixel ratio. Presented at
           that size the canvas overflows its host — 2556px inside a 1278px shell at
           2x — and only the left-hand part of the game is visible. The split is:
           the page decides how large the canvas is presented, the client decides how
           many pixels it renders into. */
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
        background: #000;
        outline: none;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #101725 0%, var(--bg) 70%);
        z-index: 10;
        transition: opacity 260ms ease;
      }

      #boot[hidden] { display: none; }

      #boot h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow: 0 2px 0 #000;
      }

      #boot .sub {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--ink-dim);
      }

      .bar {
        width: min(340px, 70vw);
        height: 3px;
        background: var(--panel-edge);
        border-radius: 2px;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        width: 35%;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        animation: sweep 1.15s ease-in-out infinite;
      }

      @keyframes sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(340%); }
      }

      #boot .err {
        max-width: min(560px, 84vw);
        color: var(--danger);
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
        white-space: pre-wrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .bar span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <!-- Bevy resizes this to the element. The attributes are only what the
           browser shows for the instant before the module loads.

           Nothing else lives in here: guidance, status and every panel are
           Bevy-owned, which is the architecture invariant the roadmap sets. A
           movement hint used to sit below the canvas and was exactly the kind
           of second UI tree that later disagrees with the first. -->
      <canvas id="ao-canvas" width="1280" height="832" tabindex="0"></canvas>
    </div>

    <div id="boot">
      <h1>Argentum</h1>
      <p class="sub">Cargando cliente…</p>
      <div class="bar"><span></span></div>
      <p class="err" id="boot-error" hidden></p>
    </div>

    <script>
      // How many whole design-sized steps of game window fit the viewport.
      //
      // Exported on `window.aoWindow` so the browser tests check the same rule
      // the page applies rather than a copy of it. A margin, so a step only
      // engages when there is visible room around it — a shell that exactly
      // equals the viewport is maximised, and maximising is a separate mode the
      // player asks for.
      const SHELL_DESIGN = { width: 1280, height: 760 };
      const SHELL_MARGIN = 0.94;

      function shellSteps(width, height) {
        const fit = Math.min(
          (width * SHELL_MARGIN) / SHELL_DESIGN.width,
          (height * SHELL_MARGIN) / SHELL_DESIGN.height
        );
        // At least one: below a single step the shell shrinks to the viewport
        // instead, which is what keeps a small laptop working.
        return Math.max(1, Math.floor(fit));
      }

      function applyShellSteps() {
        const steps = shellSteps(window.innerWidth, window.innerHeight);
        document.documentElement.style.setProperty("--shell-steps", String(steps));
        return steps;
      }

      applyShellSteps();
      // Resize covers browser zoom and a move to another monitor as well: both
      // change innerWidth/innerHeight, and both should be able to change the
      // step. Bevy picks the new rectangle up from its own resize observer.
      window.addEventListener("resize", applyShellSteps);

      // Keys the client owns, which the browser would otherwise act on first.
      //
      // Tab moves browser focus out of the canvas, which ends the game session's
      // keyboard entirely — the player is then tabbing through page furniture with
      // no way back except clicking. F6 is a browser shortcut on some platforms.
      // Both are the client's, and only while the canvas actually has focus, so
      // keyboard access to the rest of the page is untouched.
      //
      // This is a capability adapter, not UI: it suppresses a default and nothing
      // more. The client decides what the keys mean.
      const CLIENT_OWNED_KEYS = new Set(["Tab", "F6"]);
      window.addEventListener(
        "keydown",
        (event) => {
          const canvas = document.getElementById("ao-canvas");
          if (canvas && document.activeElement === canvas && CLIENT_OWNED_KEYS.has(event.key)) {
            event.preventDefault();
          }
        },
        // Capture, so this runs before anything else can act on the key.
        true
      );

      // Browser-capability adapter, not application UI. Bevy owns every screen
      // and cannot resize or fullscreen its own host element; this exposes the
      // two things only the page can do.
      //
      // The host is authoritative about which mode it is in. Bevy mirrors it
      // and re-reads it, because Escape leaves fullscreen without telling
      // anyone.
      window.aoWindow = {
        /// The windowed step rule, so a test checks this rule and not a copy.
        shellSteps,
        shellDesign: SHELL_DESIGN,

        /// "windowed" | "maximized" | "fullscreen"
        getMode() {
          if (document.fullscreenElement) return "fullscreen";
          const shell = document.getElementById("shell");
          return shell?.classList.contains("maximized") ? "maximized" : "windowed";
        },

        /// Returns the mode actually reached, which may not be the one asked
        /// for: fullscreen needs a recent user gesture and can be refused.
        async setMode(mode) {
          const shell = document.getElementById("shell");
          if (!shell) return "windowed";

          try {
            if (mode === "fullscreen") {
              if (!document.fullscreenElement) await shell.requestFullscreen();
              shell.classList.remove("maximized");
              return "fullscreen";
            }

            if (document.fullscreenElement) await document.exitFullscreen();
            shell.classList.toggle("maximized", mode === "maximized");
            return mode;
          } catch (error) {
            // Denied or unsupported. Fall back to maximized so the control
            // still does something visible, and report what actually happened
            // rather than letting the client believe it succeeded.
            console.warn("aoWindow.setMode refused", error);
            shell.classList.add("maximized");
            return "maximized";
          }
        },
      };
    </script>

    <script type="module">
      // Version the client's URLs so a rebuild is actually fetched.
      //
      // In production this must be a *stable* value or the 5.6 MB compressed
      // payload can never be cached by a browser or a CDN — a timestamp on
      // every load would re-download the whole client each time. So the build
      // id is used, which changes exactly when the client does.
      //
      // Development is the opposite problem: rebuilds share a commit while the
      // tree is dirty, and a cached module presents as "the fix did not work"
      // when the fix was never loaded. There, a timestamp is correct.
      const isDevHost = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);

      async function clientVersion() {
        if (isDevHost) return String(Date.now());
        try {
          const response = await fetch("./pkg/build-id.txt", { cache: "no-store" });
          if (response.ok) return (await response.text()).trim();
        } catch {
          // Fall through: an unversioned load is better than no load.
        }
        return "unknown";
      }

      const version = await clientVersion();
      const { default: init } = await import(`./pkg/ao-client.js?v=${version}`);

      const boot = document.getElementById("boot");
      const bootError = document.getElementById("boot-error");

      function fail(message) {
        bootError.hidden = false;
        bootError.textContent = message;
        boot.querySelector(".bar")?.remove();
        boot.querySelector(".sub")?.remove();
      }

      try {
        // Both halves need the same version: the module URL covers the JS,
        // and init() is given the wasm URL explicitly because wasm-bindgen
        // would otherwise resolve an unversioned path of its own and serve a
        // stale binary behind fresh glue.
        await init({
          module_or_path: `./pkg/ao-client_bg.wasm?v=${version}`,
        });
        // Bevy takes over the canvas from here. Give it a frame to present
        // before lifting the boot screen, so there is no black flash between.
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            boot.style.opacity = "0";
            setTimeout(() => (boot.hidden = true), 260);
            document.getElementById("ao-canvas")?.focus();
          })
        );
      } catch (error) {
        // Bevy's winit shuts the app down by throwing a control-flow exception;
        // that is not a load failure and must not be reported as one.
        const text = String(error?.message ?? error);
        if (text.includes("Using exceptions for control flow")) {
          boot.hidden = true;
        } else {
          console.error("client boot failed", error);
          fail(`No se pudo iniciar el cliente.\n\n${text}`);
        }
      }
    </script>
  </body>
</html>
