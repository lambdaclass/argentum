name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.16.3
          otp-version: 26.2.5.5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang protobuf-compiler
        working-directory: .

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-prod-mix-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-prod-mix-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build release
        env:
          MIX_ENV: prod
          SECRET_KEY_BASE: ci-secret-key-base
          PHX_HOST: localhost
          PORT: "4000"
        run: |
          mix compile --warnings-as-errors
          mix release

      - name: Package release
        run: |
          tar -C _build/prod/rel -czf ../argentum-${GITHUB_REF_NAME}-linux-amd64.tar.gz argentum

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: argentum-${{ github.ref_name }}-linux-amd64
          path: argentum-${{ github.ref_name }}-linux-amd64.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: argentum-${{ github.ref_name }}-linux-amd64.tar.gz
